q2q:
  Vendor: Samsung
  PrettyName: Z Fold 3
  DeviceType: phone
  GridUnit: 20
  SupportedOrientations:
    - Portrait
    - InvertedPortrait
    - Landscape
    - InvertedLandscape
  PrimaryOrientation:
    - Portrait
  LomiriInteractiveBlur:
    - true
  NumBuiltInDisplays: 2
  OfonoPlugin: binder
  OfonoImplementsIms: true
  RepowerdIgnoreLidEvents:
    - true
  FoldableSysfsPath:
    - /sys/devices/virtual/sec/hall_ic/flip_status
  BacklightSysfsPath:
    - /sys/class/backlight/panel0-backlight
  FlashlightSysfsPath:
    - /sys/class/leds/torch-sec1/brightness
